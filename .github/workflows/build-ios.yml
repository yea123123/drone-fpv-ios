name: Build iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build unsigned app
        run: |
          set -euo pipefail

          xcodebuild clean build \
            -project DroneFPV.xcodeproj \
            -scheme DroneFPV \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name 'DroneFPV.app' | head -n 1)"
          test -n "$APP_PATH"

          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/

          (
            cd build/ipa
            zip -qry DroneFPV.ipa Payload
          )

          ls -lh build/ipa/DroneFPV.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DroneFPV-unsigned-ipa
          path: build/ipa/DroneFPV.ipa
          retention-days: 30
