name: Build iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build iOS App
      run: |
        xcodebuild clean build \
          -project DroneFPV.xcodeproj \
          -scheme DroneFPV \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Create Archive
      run: |
        xcodebuild archive \
          -project DroneFPV.xcodeproj \
          -scheme DroneFPV \
          -configuration Release \
          -archivePath $PWD/build/DroneFPV.xcarchive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Export IPA
      run: |
        mkdir -p build/ipa
        cd build/DroneFPV.xcarchive/Products/Applications
        mkdir Payload
        cp -r DroneFPV.app Payload/
        zip -r ../../../../build/ipa/DroneFPV.ipa Payload
        cd ../../../../
        ls -lh build/ipa/

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: DroneFPV-IPA
        path: build/ipa/*.ipa
        retention-days: 30
